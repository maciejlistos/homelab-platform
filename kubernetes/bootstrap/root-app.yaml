apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: homelab-root
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/maciejlistos/homelab-platform.git
    targetRevision: main
    path: kubernetes/applications

    directory:
      recurse: true

  destination:
    server: https://kubernetes.default.svc
    namespace: argocd

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
