apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: traillog
  namespace: traillog
spec:
  ingressClassName: tailscale
  tls:
    - hosts:
        - traillog
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: traillog
                port:
                  number: 80
