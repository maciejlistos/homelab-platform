apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: tailscale
  namespace: argocd

spec:
  project: default

  sources:
    - repoURL: https://pkgs.tailscale.com/helmcharts
      chart: tailscale-operator
      targetRevision: 1.102.3

      helm:
        valueFiles:
          - $values/kubernetes/platform/tailscale/values.yaml

    - repoURL: https://github.com/maciejlistos/homelab-platform.git
      targetRevision: main
      ref: values

  destination:
    server: https://kubernetes.default.svc
    namespace: tailscale

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
