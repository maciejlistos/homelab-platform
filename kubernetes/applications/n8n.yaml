apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: n8n
  namespace: argocd

spec:
  project: default

  sources:
    - repoURL: ghcr.io/n8n-io/n8n-helm-chart
      chart: n8n
      targetRevision: 1.11.0

      helm:
        releaseName: n8n

        valueFiles:
          - $values/kubernetes/platform/n8n/values.yaml

    - repoURL: https://github.com/maciejlistos/homelab-platform.git
      targetRevision: main
      ref: values

    - repoURL: https://github.com/maciejlistos/homelab-platform.git
      targetRevision: main
      path: kubernetes/platform/n8n/manifests

  destination:
    server: https://kubernetes.default.svc
    namespace: n8n

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
