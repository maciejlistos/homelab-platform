apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: forgejo-runner
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/maciejlistos/homelab-platform.git
    targetRevision: main
    path: kubernetes/platform/forgejo-runner/manifests

  destination:
    server: https://kubernetes.default.svc
    namespace: forgejo-runner

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
