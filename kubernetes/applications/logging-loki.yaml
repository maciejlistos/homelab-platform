apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: logging-loki
  namespace: argocd

spec:
  project: default

  sources:
    - repoURL: https://grafana-community.github.io/helm-charts
      chart: loki
      targetRevision: 18.13.0

      helm:
        releaseName: loki
        valueFiles:
          - $values/kubernetes/platform/logging/loki/values.yaml

    - repoURL: https://github.com/maciejlistos/homelab-platform.git
      targetRevision: main
      ref: values

    - repoURL: https://github.com/maciejlistos/homelab-platform.git
      targetRevision: main
      path: kubernetes/platform/logging/loki/manifests

  destination:
    server: https://kubernetes.default.svc
    namespace: logging

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
