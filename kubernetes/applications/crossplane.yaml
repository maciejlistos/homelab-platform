apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: crossplane
  namespace: argocd
spec:
  project: default

  sources:
    - repoURL: https://charts.crossplane.io/stable
      chart: crossplane
      targetRevision: 2.4.0

      helm:
        releaseName: crossplane

        values: |
          replicas: 1

          metrics:
            enabled: true

    - repoURL: https://github.com/maciejlistos/homelab-platform.git
      targetRevision: main
      path: kubernetes/platform/crossplane/providers/kubernetes/

  destination:
    server: https://kubernetes.default.svc
    namespace: crossplane-system

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
