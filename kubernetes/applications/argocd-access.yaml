apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: argocd-access
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/maciejlistos/homelab-platform.git
    targetRevision: main
    path: kubernetes/platform/argocd/access

  destination:
    server: https://kubernetes.default.svc
    namespace: argocd

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - ServerSideApply=true
