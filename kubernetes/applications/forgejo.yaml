apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: forgejo
  namespace: argocd

spec:
  project: default

  sources:
    - repoURL: code.forgejo.org/forgejo-helm
      chart: forgejo
      targetRevision: 17.1.5

      helm:
        releaseName: forgejo

        valueFiles:
          - $values/kubernetes/platform/forgejo/values.yaml

    - repoURL: https://github.com/maciejlistos/homelab-platform.git
      targetRevision: main
      ref: values

    - repoURL: https://github.com/maciejlistos/homelab-platform.git
      targetRevision: main
      path: kubernetes/platform/forgejo/manifests

  destination:
    server: https://kubernetes.default.svc
    namespace: forgejo

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
