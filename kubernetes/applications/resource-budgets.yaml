apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: resource-budgets
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/maciejlistos/homelab-platform.git
    targetRevision: main
    path: kubernetes/platform/resource-budgets
  destination:
    server: https://kubernetes.default.svc
    namespace: experiments
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true