apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: home-assistant
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/maciejlistos/homelab-platform.git
    targetRevision: main
    path: kubernetes/platform/home-assistant

    directory:
      recurse: true

  destination:
    server: https://kubernetes.default.svc
    namespace: home-assistant

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    managedNamespaceMetadata:
      labels:
        pod-security.kubernetes.io/enforce: privileged
        pod-security.kubernetes.io/audit: privileged
        pod-security.kubernetes.io/warn: privileged

    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
