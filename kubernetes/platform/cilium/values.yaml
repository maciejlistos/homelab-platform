kubeProxyReplacement: true

l2announcements:
  enabled: true

k8sClientRateLimit:
  qps: 10
  burst: 20

k8sServiceHost: localhost
k8sServicePort: 7445

ipam:
  mode: kubernetes

routingMode: tunnel
tunnelProtocol: vxlan
tunnelPort: 8472

cni:
  exclusive: true
  uninstall: false

policyEnforcementMode: default
policyAuditMode: false

operator:
  replicas: 2
  unmanagedPodWatcher:
    restart: false

hubble:
  enabled: true
  relay:
    enabled: true
  ui:
    enabled: true

bpf:
  autoMount:
    enabled: false
  hostLegacyRouting: true

cgroup:
  autoMount:
    enabled: false
  hostRoot: /sys/fs/cgroup

securityContext:
  capabilities:
    ciliumAgent:
      - CHOWN
      - KILL
      - NET_ADMIN
      - NET_RAW
      - IPC_LOCK
      - SYS_ADMIN
      - SYS_RESOURCE
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    cleanCiliumState:
      - NET_ADMIN
      - SYS_ADMIN
      - SYS_RESOURCE
