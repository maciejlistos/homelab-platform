apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: loki
  namespace: logging

  annotations:
    tailscale.com/tags: tag:logging

spec:
  ingressClassName: tailscale

  defaultBackend:
    service:
      name: loki-gateway
      port:
        number: 80

  tls:
    - hosts:
        - loki-homelab
