apiVersion: v1
kind: LimitRange
metadata:
  name: container-budgets
  namespace: forgejo-runner
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 100m
        memory: 128Mi
        ephemeral-storage: 128Mi
      default:
        cpu: "1"
        memory: 512Mi
        ephemeral-storage: 1Gi
      max:
        cpu: "4"
        memory: 6Gi
        ephemeral-storage: 32Gi
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: namespace-budget
  namespace: forgejo-runner
spec:
  hard:
    requests.cpu: "2"
    limits.cpu: "8"
    requests.memory: 2Gi
    limits.memory: 12Gi
    requests.ephemeral-storage: 8Gi
    limits.ephemeral-storage: 64Gi
    pods: "4"