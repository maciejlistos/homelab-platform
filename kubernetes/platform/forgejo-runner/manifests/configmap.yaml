apiVersion: v1
kind: ConfigMap
metadata:
  name: forgejo-runner-config
  namespace: forgejo-runner
data:
  config.yaml: |
    log:
      level: info
      job_level: info

    runner:
      file: /data/.runner
      capacity: 5
      envs: {}
      env_file: ""
      timeout: 1h
      shutdown_timeout: 30s
      insecure: false
      fetch_timeout: 30s
      fetch_interval: 5s
      report_interval: 1s
      labels:
        - homelab:docker://docker.io/library/node:22-bookworm

    cache:
      enabled: false

    container:
      network: ""
      enable_ipv6: false
      privileged: false
      options: ""
      workdir_parent: /workspace
      valid_volumes: []
      docker_host: "-"
      force_pull: true
      force_rebuild: false

    host:
      workdir_parent: /data/workspace

    server:
      connections:
        homelab:
          url: http://forgejo-http.forgejo.svc.cluster.local:3000/
          uuid: "cc3916de-5047-442e-843f-0350ab501710"
          token_url: file:/secrets/token
