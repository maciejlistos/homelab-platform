apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor

metadata:
  name: home-assistant
  namespace: monitoring

  labels:
    release: kube-prometheus-stack

spec:
  jobLabel: app.kubernetes.io/name

  namespaceSelector:
    matchNames:
      - home-assistant

  selector:
    matchLabels:
      app.kubernetes.io/name: home-assistant

  endpoints:
    - port: http
      path: /api/prometheus
      interval: 30s

      authorization:
        type: Bearer
        credentials:
          name: home-assistant-prometheus-token
          key: token
