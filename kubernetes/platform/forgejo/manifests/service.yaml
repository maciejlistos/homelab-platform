apiVersion: v1
kind: Service
metadata:
  name: forgejo-lan
  namespace: forgejo
  labels:
    homelab.maciejl.io/exposure: forgejo-lan
spec:
  type: LoadBalancer
  externalTrafficPolicy: Cluster
  selector:
    app: forgejo-lan-proxy
  ports:
    - name: https
      port: 443
      targetPort: https
      protocol: TCP
