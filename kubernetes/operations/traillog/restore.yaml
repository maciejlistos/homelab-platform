apiVersion: batch/v1
kind: Job

metadata:
  name: traillog-restore
  namespace: traillog

spec:
  backoffLimit: 0

  template:
    metadata:
      labels:
        app.kubernetes.io/name: traillog-restore

    spec:
      restartPolicy: Never

      automountServiceAccountToken: false
      enableServiceLinks: false
      imagePullSecrets:
        - name: traillog-registry

      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532

        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: restore

          image: forgejo.example.ts.net/maciejlistos/traillog:7d461e1

          imagePullPolicy: IfNotPresent

          command:
            - /app/traillog-backup

          args:
            - restore
            - --backup=/backups/traillog-20261015T132804.191415985Z.db
            - --target=/data/traillog.db

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true

            capabilities:
              drop:
                - ALL

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi

          volumeMounts:
            - name: data
              mountPath: /data

            - name: backups
              mountPath: /backups
              readOnly: true

            - name: tmp
              mountPath: /tmp

      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: data-traillog-0

        - name: backups
          persistentVolumeClaim:
            claimName: traillog-backups

        - name: tmp
          emptyDir:
            sizeLimit: 128Mi
