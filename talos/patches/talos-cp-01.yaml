apiVersion: v1alpha1
kind: HostnameConfig
hostname: talos-cp-01
auto: off
---
cluster:
  controllerManager:
    extraArgs:
      bind-address: "0.0.0.0"
  scheduler:
    extraArgs:
      bind-address: "0.0.0.0"

  etcd:
    extraArgs:
      listen-metrics-urls: "http://0.0.0.0:2381"

  network:
    cni:
      name: none

  proxy:
    disabled: true

machine:
  install:
    diskSelector:
      serial: "0x00000000"
    image: factory.talos.dev/metal-installer/613e1592b2da41ae5e265e8789429f22e121aab91cb4deb6bc3c0b6262961245:v1.13.9
    wipe: true

  network:
    extraHostEntries:
      - ip: 10.20.0.50
        aliases:
          - forgejo.example.ts.net
  registries:
    config:
      forgejo.example.ts.net:
        tls:
          ca: REPLACE_WITH_BASE64_ENCODED_REGISTRY_CA

  kubelet:
    extraMounts:
      - destination: /var/mnt/longhorn
        type: bind
        source: /var/mnt/longhorn
        options:
          - bind
          - rshared
          - rw
    extraConfig:
      serverTLSBootstrap: true

  nodeLabels:
    node.longhorn.io/create-default-disk: "true"

---
apiVersion: v1alpha1
kind: UserVolumeConfig
name: longhorn

provisioning:
  diskSelector:
    match: disk.dev_path == "/dev/sda"
  grow: true
  minSize: 10GiB

filesystem:
  type: ext4
