apiVersion: apps/v1
kind: Deployment
metadata:
  name: forgejo-runner
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: forgejo-runner
  template:
    metadata:
      labels:
        app: forgejo-runner
    spec:
      containers:
      - name: runner
        image: data.forgejo.org/forgejo/runner:13.0.0
        securityContext:
          runAsUser: 1000
          runAsGroup: 1000
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: '1'
            memory: 512Mi
      - name: docker
        image: docker:28.5.2-dind
        securityContext:
          privileged: true
          runAsUser: 0
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
            ephemeral-storage: 2Gi
          limits:
            cpu: '2'
            memory: 4Gi
            ephemeral-storage: 25Gi
