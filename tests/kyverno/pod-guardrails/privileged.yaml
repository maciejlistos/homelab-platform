apiVersion: v1
kind: Pod
metadata:
  name: privileged
  namespace: policy-lab
spec:
  containers:
  - name: app
    image: busybox:1.37.0
    command:
    - sleep
    - '3600'
    securityContext:
      privileged: true
      allowPrivilegeEscalation: false
    resources:
      requests:
        cpu: 10m
        memory: 16Mi
      limits:
        memory: 32Mi
