apiVersion: apps/v1
kind: Deployment
metadata:
  name: privileged-deployment
  namespace: policy-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: privileged-deployment
  template:
    metadata:
      labels:
        app: privileged-deployment
    spec:
      containers:
      - name: app
        image: busybox:1.37.0
        command:
        - sleep
        - '3600'
        securityContext:
          privileged: true
          allowPrivilegeEscalation: false
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            memory: 32Mi
