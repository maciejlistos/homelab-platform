apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: homelab-deployment-guardrails
spec:
  validationActions:
  - Audit
  failurePolicy: Ignore
  evaluation:
    admission:
      enabled: true
    background:
      enabled: true
  matchConstraints:
    resourceRules:
    - apiGroups:
      - apps
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - deployments
  variables:
  - name: approvedRunner
    expression: object.metadata.namespace == "forgejo-runner" && object.metadata.name == "forgejo-runner"
  - name: workloadContainers
    expression: object.spec.template.spec.containers + object.spec.template.spec.?initContainers.orValue([])
  - name: allContainers
    expression: |-
      object.spec.template.spec.containers.filter(c,
        !(variables.approvedRunner &&
          c.name == "docker" &&
          c.image == "docker:28.5.2-dind")) +
      object.spec.template.spec.?initContainers.orValue([])
  validations:
  - message: Containers must not run privileged.
    expression: |-
      variables.allContainers.all(c,
        !c.?securityContext.privileged.orValue(false))
  - message: Containers must explicitly disable privilege escalation.
    expression: |-
      variables.allContainers.all(c,
        c.?securityContext.allowPrivilegeEscalation.orValue(true) == false)
  - message: Containers must specify CPU/memory requests and a memory limit.
    expression: |-
      variables.workloadContainers.all(c,
        has(c.resources) &&
        has(c.resources.requests) &&
        "cpu" in c.resources.requests &&
        "memory" in c.resources.requests &&
        has(c.resources.limits) &&
        "memory" in c.resources.limits)
